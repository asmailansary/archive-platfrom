name: AFAS AI Auto-Developer

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai

      - name: Run AI Agent to Modify Files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<EOF
          import os
          import json
          from openai import OpenAI
          
          client = OpenAI(api_key=os.environ['OPENAI_API_KEY'])
          issue_content = os.environ.get('ISSUE_BODY', '')
          
          system_prompt = '''أنت مبرمج ذكاء اصطناعي تدير مستودع منصة AFAS.
          بناءً على طلب المستخدم، قم بكتابة أو تحديث الأكواد المطلوبة.
          هام جداً: يجب أن يكون ردك عبارة عن JSON فقط (بدون أي شروحات، أو مقدمات، أو نصوص خارج الـ JSON).
          الـ JSON يجب أن يكون مصفوفة (Array) تحتوي على الكائنات التالية:
          [{"file_path": "index.html", "content": "الكود الكامل للملف هنا"}]
          تأكد من كتابة الكود كاملاً للملفات المطلوبة لتعمل المنصة بشكل صحيح.
          '''
          
          print('جاري التواصل مع شات جي بي تي وتحليل الطلب...')
          try:
              response = client.chat.completions.create(
                  model='gpt-4o-mini',
                  messages=[
                      {'role': 'system', 'content': system_prompt},
                      {'role': 'user', 'content': issue_content}
                  ]
              )
              
              ai_response = response.choices[0].message.content.strip()
              
              if ai_response.startswith('\`\`\`json'):
                  ai_response = ai_response[7:-3].strip()
              elif ai_response.startswith('\`\`\`'):
                  ai_response = ai_response[3:-3].strip()
              
              files_to_update = json.loads(ai_response)
              
              for file_obj in files_to_update:
                  path = file_obj['file_path']
                  content = file_obj['content']
                  
                  os.makedirs(os.path.dirname(path) if os.path.dirname(path) else '.', exist_ok=True)
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'تم تحديث الملف بنجاح: ' + path)
          except Exception as e:
              print('حدث خطأ أثناء معالجة رد الذكاء الاصطناعي:', e)
          EOF
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "لا توجد تعديلات جديدة لرفعها."
          else
            git commit -m "تحديث تلقائي من الذكاء الاصطناعي بناءً على الطلب"
            git push
            echo "تم رفع التعديلات للمستودع بنجاح!"
          fi
