<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Archives of the Ansar Tribe in French Sudan</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/esm/index.js"></script>
</head>
<body>
    <header>
        <h1>French Archives of the Ansar Tribe in French Sudan (AFAS)</h1>
    </header>
    <main>
        <section id="documents">
            <h2>Documents</h2>
            <div id="document-viewer"></div>
            <div id="search-engine">
                <input type="text" id="search-input" placeholder="Search...">
                <button id="search-button">Search</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 French Archives of the Ansar Tribe in French Sudan</p>
    </footer>
    <script>
        const SUPABASE_URL = "your_supabase_url";
        const SUPABASE_ANON_KEY = "your_supabase_anon_key";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchDocuments() {
            const { data, error } = await supabase
                .from('articles')
                .select('*');

            if (error) console.error('Error fetching documents:', error);
            else console.log('Documents:', data);
        }

        document.getElementById('search-button').addEventListener('click', fetchDocuments);
        fetchDocuments();
    </script>
</body>
</html>
